[tools]
node = "26"
pnpm = "12"
go = "1.27"

[tasks.setup]
description = "Install the pinned toolchain and workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the development server"
run = "pnpm dev"

[tasks.format]
description = "Format the workspace"
run = "pnpm format"

[tasks.check]
description = "Run the full repository validation suite"
run = "pnpm lint && pnpm format:check && pnpm licenses:check && (cd daemon && go vet ./... && go test ./...) && pnpm typecheck && pnpm test && pnpm build"
