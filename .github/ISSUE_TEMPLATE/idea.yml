name: An idea
description: Something Hive Runner should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, more than the feature you would add.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: read
    attributes:
      label: Checked
      options:
        - label: I looked at docs/goals-and-decisions.md for whether this was already decided
