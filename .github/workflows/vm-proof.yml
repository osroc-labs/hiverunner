# Temporary: proves the daemon's VM runner against GitHub with a hand-minted
# runner configuration, before the scale set listener exists. Runs only when
# this file itself is pushed to the branch.
name: VM proof
on:
  push:
    branches: [feat-vm-runner]
    paths: [".github/workflows/vm-proof.yml"]
permissions:
  contents: read
jobs:
  proof:
    runs-on: [self-hosted, hive-dev-proof]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Where am I
        run: |
          uname -srm
          echo "cpus=$(nproc) user=$(whoami)"
          cat /etc/hive-release
      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: The daemon's own tests, inside the VM it boots
        working-directory: daemon
        run: go test ./...
