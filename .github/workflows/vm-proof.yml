# Temporary: checks that a guest with an outdated runner can update itself
# inside a throwaway VM and still take its job. Runs only when this file is
# pushed to the branch.
name: VM proof
on:
  push:
    branches: [feat-vm-runner]
    paths: [".github/workflows/vm-proof.yml"]
permissions:
  contents: read
jobs:
  proof:
    runs-on: [self-hosted, hive-dev-proof]
    timeout-minutes: 15
    steps:
      - name: Which runner am I
        run: |
          cat /etc/hive-release
          cat /opt/runner/.runner 2>/dev/null | head -c 0
          ls /opt/runner | head -30
          /opt/runner/bin/Runner.Listener --version || true
