name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  # Where the deploy runs: this organization's own hive when one of its
  # machines is free, GitHub's runner when none is.
  route:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      runner: ${{ steps.hive.outputs.runner }}
    steps:
      - id: hive
        uses: thecomputerplumbers/hive-route@v1
        with:
          label: hive
          fallback: ubuntu-latest
  # Deploying the coordinator drops every machine's tunnel, the one this job
  # runs on included. The job carries on, and the daemon reconnects by itself.
  deploy:
    needs: route
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Give the hive's image what Node needs on arm64
        if: runner.environment == 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:worker
      - run: pnpm release "${{ inputs.environment }}"
